<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Kings Manager 7v7 — Tests</title>
<style>
  body {
    background: #0a0a0a; color: #dde8f5; font-family: "Segoe UI", sans-serif;
    max-width: 900px; margin: 0 auto; padding: 30px 20px 60px;
  }
  h1 { color: #ffc700; font-size: 1.4em; margin-bottom: 4px; }
  p.sub { color: #8391a8; margin-top: 0; font-size: 0.9em; }
  #summary {
    font-size: 1.1em; font-weight: 700; padding: 14px 18px; border-radius: 10px;
    margin: 18px 0; border: 1px solid rgba(255,255,255,0.1);
  }
  #summary.all-pass { background: rgba(0,255,136,0.12); border-color: rgba(0,255,136,0.35); color: #b6ffd9; }
  #summary.has-fail { background: rgba(255,90,90,0.12); border-color: rgba(255,90,90,0.35); color: #ffd6d6; }
  .row {
    display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 8px;
    margin-bottom: 6px; background: rgba(255,255,255,0.03); font-size: 0.92em;
  }
  .row.fail { background: rgba(255,90,90,0.08); border: 1px solid rgba(255,90,90,0.3); }
  .row.pass { border: 1px solid transparent; }
  .icon { flex-shrink: 0; }
  .name { font-weight: 600; }
  .error { color: #ff9a9a; margin-top: 4px; font-family: monospace; font-size: 0.9em; }
</style>
</head>
<body>
  <h1>Kings Manager 7v7 — Tests automatisés</h1>
  <p class="sub">data.js + engine.js + matchphysics.js (moteurs purs, sans DOM) — voir tests.js pour le détail de chaque test.</p>
  <div id="summary">Exécution en cours…</div>
  <div id="results"></div>

  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="matchphysics.js"></script>
  <script src="tests.js"></script>
  <script>
    const report = runAllTests();
    const summaryEl = document.getElementById("summary");
    summaryEl.className = report.failed === 0 ? "all-pass" : "has-fail";
    summaryEl.textContent = report.failed === 0
      ? `✅ ${report.passed} / ${report.passed} tests réussis`
      : `❌ ${report.failed} / ${report.passed + report.failed} tests en échec`;

    document.getElementById("results").innerHTML = report.results.map(r => `
      <div class="row ${r.pass ? "pass" : "fail"}">
        <span class="icon">${r.pass ? "✅" : "❌"}</span>
        <div>
          <div class="name">${r.name}</div>
          ${r.pass ? "" : `<div class="error">${r.error}</div>`}
        </div>
      </div>
    `).join("");
  </script>
</body>
</html>
